name: Deploy to VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 4m
          timeout: 120s
          script: |
            cd /root/Twins || cd ~/Twins
            git pull origin main
            touch .just_updated
            sudo systemctl restart twins-bot1 twins-bot2 twins-tghub twins-tgchat twins-discord1 twins-discord2
            echo "Deployment successful!"
